#
# torus3d_8x8 - an 8x8x4 three-dimensional torus. TRAILER-SCOPED, not a catalogue variant.
#
# This is the main-menu attract sequence's "the same board, gaining a dimension" beat
# (M13.9). `torus3d` is 4x4x4; the sequence's 2-D beats are all 8x8, so this one is built
# at the same 8x8 scale the trailer needs - the construction is otherwise identical to
# `torus3d.toml` (three periodic identifications, no code). It exists for that sequence
# and should not be read as a shipped game; `torus3d` is the 4x4x4 catalogue entry.
#
# Unlike Klein, every one of this board's three identifications is a plain periodic
# gluing with no flip, so the geometry is fully orientable - "forward" has a consistent
# global meaning here the way it does on `torus.toml`, and there is no structural reason
# to leave pawns out the way `torus3d.toml` (its 4x4x4 catalogue sibling) does. A full
# army, not just king/rook/knight, carries through the M13.9 attract sequence's own
# continuity cut (M13.9 Part F revision: "take the geometry, not the restricted army").
# No [promotion] block, for the same reason `torus.toml` has none: no cell is a "last
# rank" here either.

name = "torus3d_8x8"
description = "An eight-by-eight-by-four cube with every face glued - the same board as the 2-D shapes, one dimension up."
difficulty = "hard"
side_to_move = "white"
en_passant = false
stalemate = "draw"
halfmove_draw_limit = 100
orientation_axis = "rank"

[[axis]]
name = "file"
extent = 8

[[axis]]
name = "rank"
extent = 8

[[axis]]
name = "level"
extent = 4

[[geometry.identify]]
axis = "file"
kind = "periodic"

[[geometry.identify]]
axis = "rank"
kind = "periodic"

[[geometry.identify]]
axis = "level"
kind = "periodic"

[[piece]]
name = "pawn"
symbol = "P"
resets_draw_clock = true

  [[piece.move]]
  vector = [1]
  max = 1
  mode = "leap"
  capture = "cannot"
  forward = true

  [[piece.move]]
  vector = [1]
  min = 2
  max = 2
  mode = "slide"
  capture = "cannot"
  forward = true
  unmoved = true
  marks = [{ tag = "ep", where = "passed", duration = 1 }]

  [[piece.move]]
  vector = [1, 1]
  max = 1
  mode = "leap"
  capture = "must"
  forward = true

  # En passant: capture-only, landing on the cell a double step passed over and taking the
  # pawn that passed it - a capture at an offset, allowed only onto an "ep" mark.
  [[piece.move]]
  vector = [1]
  pin = ["rank:+1"]
  max = 1
  mode = "leap"
  capture = "must"
  flip = true
  captures_at = ["rank:-1"]
  needs_mark = "ep"

[[piece]]
name = "knight"
symbol = "N"

  [[piece.move]]
  vector = [1, 2]
  max = 1
  mode = "leap"

[[piece]]
name = "bishop"
symbol = "B"

  [[piece.move]]
  vector = [1, 1]
  max = "inf"
  mode = "slide"

[[piece]]
name = "rook"
symbol = "R"

  [[piece.move]]
  vector = [1]
  max = "inf"
  mode = "slide"

[[piece]]
name = "queen"
symbol = "Q"
moves = "queen"

[[piece]]
name = "king"
symbol = "K"
royal = true
moves = "king"

# Full standard armies now (M13.9 Part F revision), not just king/rook/knight: the
# geometry is what made the restricted roster seem necessary, and this geometry does not
# actually require it (see the file's own top comment). Still separated along the level
# axis the way the original K/R/N-only army was, white at level 0 and black at level 2 -
# two apart on a 4-level wrap, so neither army's own back rank sits level-adjacent to the
# other's. Black's back rank sits one rank off its pawns' far edge the same way white's
# does, mirrored: pawns toward the centre, king row toward its own level's rank seam.

[start]
board = "8/8/8/8/8/8/PPPPPPPP/RNBQKBNR|8/8/8/8/8/8/8/8|8/8/8/8/8/8/rnbqkbnr/pppppppp|8/8/8/8/8/8/8/8"
