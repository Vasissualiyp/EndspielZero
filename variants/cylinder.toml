#
# cylinder - standard chess with the files glued into a loop.
#
# The a-file and the h-file are adjacent, so a rook on a1 attacks h1, and a bishop
# leaving the board's edge reappears on the other side still travelling on the same
# diagonal. Nothing about the pieces changes; the single [[geometry.identify]] block
# below is the whole difference from standard chess.
#
# The rank axis keeps its walls, and the gluing preserves orientation, so "forward"
# and "the last rank" both still mean what they normally mean: pawns, promotion,
# en passant and castling all carry over unchanged. Contrast with klein.toml, where
# they cannot.

name = "cylinder"
description = "The files are glued into a loop. Pawns, promotion and castling all survive the curvature."
difficulty = "easy"
side_to_move = "white"
en_passant = false
stalemate = "draw"
halfmove_draw_limit = 100
orientation_axis = "rank"

[[axis]]
name = "file"
extent = 8

[[axis]]
name = "rank"
extent = 8

[[geometry.identify]]
axis = "file"
kind = "periodic"

[promotion]
rank = 7

[[piece]]
name = "pawn"
symbol = "P"
resets_draw_clock = true
promotes_to = ["knight", "bishop", "rook", "queen"]

  [[piece.move]]
  vector = [1]
  max = 1
  mode = "leap"
  capture = "cannot"
  forward = true

  [[piece.move]]
  vector = [1]
  min = 2
  max = 2
  mode = "slide"
  capture = "cannot"
  forward = true
  unmoved = true
  marks = [{ tag = "ep", where = "passed", duration = 1 }]

  [[piece.move]]
  vector = [1, 1]
  max = 1
  mode = "leap"
  capture = "must"
  forward = true

  # En passant: capture-only, landing on the cell a double step passed over and taking the
  # pawn that passed it - a capture at an offset, allowed only onto an "ep" mark.
  [[piece.move]]
  vector = [1]
  pin = ["rank:+1"]
  max = 1
  mode = "leap"
  capture = "must"
  flip = true
  captures_at = ["rank:-1"]
  needs_mark = "ep"

[[piece]]
name = "knight"
symbol = "N"

  [[piece.move]]
  vector = [1, 2]
  max = 1
  mode = "leap"

[[piece]]
name = "bishop"
symbol = "B"

  [[piece.move]]
  vector = [1, 1]
  max = "inf"
  mode = "slide"

[[piece]]
name = "rook"
symbol = "R"

  [[piece.move]]
  vector = [1]
  max = "inf"
  mode = "slide"

[[piece]]
name = "queen"
symbol = "Q"
moves = "queen"

[[piece]]
name = "king"
symbol = "K"
royal = true
moves = "king"

# ---------------------------------------------------------------------------
# Castling, as compound moves: the king steps two along the file, the rook is *found* beyond
# it (the first rook along the way, unmoved), and the king's start, the cell it crosses and
# the cell it lands on must not be attacked. No cell is named, so the same two definitions
# castle on any board size, in any dimension.
# ---------------------------------------------------------------------------

[[compound]]
name = "castle kingside"
piece = "king"
vector = [2, 0]
partner = ["rook"]
safe = ["from", "path", "to"]
fen = "K"

[[compound]]
name = "castle queenside"
piece = "king"
vector = [-2, 0]
partner = ["rook"]
safe = ["from", "path", "to"]
fen = "Q"

[start]
board = "rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR"
