#
# cylinder - standard chess with the files glued into a loop.
#
# The a-file and the h-file are adjacent, so a rook on a1 attacks h1, and a bishop
# leaving the board's edge reappears on the other side still travelling on the same
# diagonal. Nothing about the pieces changes; the single [[geometry.identify]] block
# below is the whole difference from standard chess.
#
# The rank axis keeps its walls, and the gluing preserves orientation, so "forward"
# and "the last rank" both still mean what they normally mean: pawns, promotion,
# en passant and castling all carry over unchanged. Contrast with klein.toml, where
# they cannot.

name = "cylinder"
description = "The files are glued into a loop. Pawns, promotion and castling all survive the curvature."
difficulty = "easy"
side_to_move = "white"
en_passant = false
stalemate = "draw"
halfmove_draw_limit = 100
orientation_axis = "rank"

[[axis]]
name = "file"
extent = 8

[[axis]]
name = "rank"
extent = 8

[[geometry.identify]]
axis = "file"
kind = "periodic"

[promotion]
rank = 7

[[piece]]
name = "pawn"
symbol = "P"
resets_draw_clock = true
promotes_to = ["knight", "bishop", "rook", "queen"]

  [[piece.move]]
  vector = [1]
  max = 1
  mode = "leap"
  capture = "cannot"
  forward = true

  [[piece.move]]
  vector = [1]
  min = 2
  max = 2
  mode = "slide"
  capture = "cannot"
  forward = true
  unmoved = true
  marks = [{ tag = "ep", where = "passed", duration = 1 }]

  [[piece.move]]
  vector = [1, 1]
  max = 1
  mode = "leap"
  capture = "must"
  forward = true

  # En passant: capture-only, landing on the cell a double step passed over and taking the
  # pawn that passed it - a capture at an offset, allowed only onto an "ep" mark.
  [[piece.move]]
  vector = [1]
  pin = ["rank:+1"]
  max = 1
  mode = "leap"
  capture = "must"
  flip = true
  captures_at = ["rank:-1"]
  needs_mark = "ep"

[[piece]]
name = "knight"
symbol = "N"

  [[piece.move]]
  vector = [1, 2]
  max = 1
  mode = "leap"

[[piece]]
name = "bishop"
symbol = "B"

  [[piece.move]]
  vector = [1, 1]
  max = "inf"
  mode = "slide"

[[piece]]
name = "rook"
symbol = "R"

  [[piece.move]]
  vector = [1]
  max = "inf"
  mode = "slide"

[[piece]]
name = "queen"
symbol = "Q"
moves = "queen"

[[piece]]
name = "king"
symbol = "K"
royal = true
moves = "king"

[[castle]]
name = "K"
color = "white"
king_from = "e1"
king_to = "g1"
rook_from = "h1"
rook_to = "f1"
empty = ["f1", "g1"]
safe = ["e1", "f1", "g1"]
rights_bit = 0

[[castle]]
name = "Q"
color = "white"
king_from = "e1"
king_to = "c1"
rook_from = "a1"
rook_to = "d1"
empty = ["b1", "c1", "d1"]
safe = ["e1", "d1", "c1"]
rights_bit = 1

[[castle]]
name = "k"
color = "black"
king_from = "e8"
king_to = "g8"
rook_from = "h8"
rook_to = "f8"
empty = ["f8", "g8"]
safe = ["e8", "f8", "g8"]
rights_bit = 2

[[castle]]
name = "q"
color = "black"
king_from = "e8"
king_to = "c8"
rook_from = "a8"
rook_to = "d8"
empty = ["b8", "c8", "d8"]
safe = ["e8", "d8", "c8"]
rights_bit = 3

[start]
board = "rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR"
