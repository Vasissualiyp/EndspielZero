#
# mobius - the files are glued into a loop with a half-twist.
#
# Crossing the file seam reverses the rank coordinate, so a rook travelling along a
# rank comes back on the mirrored rank and needs two circuits to return home. The
# board is non-orientable: it has no consistent notion of which way is "up".
#
# Pawns are kept, and the twist is their whole story. A pawn's "forward" is carried
# across the seam like everything else: a pawn that captures across it lands on the
# mirrored rank facing the other way, and from then on moves, double-steps and promotes
# like a pawn of the other colour (it is *flipped*; FEN marks it with a trailing ').
# Cross back and it turns round again. Pushes run along the ranks, which are never
# glued, so only a diagonal capture across the file seam can flip a pawn.

name = "mobius"
description = "The files are glued with a half-twist. Ride the board twice and you come home mirrored."
difficulty = "medium"
side_to_move = "white"
en_passant = false
stalemate = "draw"
halfmove_draw_limit = 100
orientation_axis = "rank"

[[axis]]
name = "file"
extent = 8

[[axis]]
name = "rank"
extent = 8

[[geometry.identify]]
axis = "file"
kind = "periodic"
flip = ["rank"]

[promotion]
rank = 7

# ---------------------------------------------------------------------------
# Pieces
# ---------------------------------------------------------------------------

[[piece]]
name = "pawn"
symbol = "P"
resets_draw_clock = true
promotes_to = ["knight", "bishop", "rook", "queen"]

  # A single step forward, which may not capture.
  [[piece.move]]
  vector = [1]
  max = 1
  mode = "leap"
  capture = "cannot"
  forward = true

  # Exactly two steps, sliding (so the intermediate cell must be empty), only
  # from the home rank, and leaving an en-passant target behind. "min" is what
  # keeps this from duplicating the single step above.
  [[piece.move]]
  vector = [1]
  min = 2
  max = 2
  mode = "slide"
  capture = "cannot"
  forward = true
  unmoved = true
  marks = [{ tag = "ep", where = "passed", duration = 1 }]

  # The diagonal capture: magnitudes {1,1}, forward, capture-only.
  [[piece.move]]
  vector = [1, 1]
  max = 1
  mode = "leap"
  capture = "must"
  forward = true

  # En passant: capture-only, landing on the cell a double step passed over and taking the
  # pawn that passed it - a capture at an offset, allowed only onto an "ep" mark.
  [[piece.move]]
  vector = [1]
  pin = ["rank:+1"]
  max = 1
  mode = "leap"
  capture = "must"
  flip = true
  captures_at = ["rank:-1"]
  needs_mark = "ep"

[[piece]]
name = "knight"
symbol = "N"

  [[piece.move]]
  vector = [1, 2]
  max = 1
  mode = "leap"

[[piece]]
name = "bishop"
symbol = "B"

  [[piece.move]]
  vector = [1, 1]
  max = "inf"
  mode = "slide"

[[piece]]
name = "rook"
symbol = "R"

  [[piece.move]]
  vector = [1]
  max = "inf"
  mode = "slide"

[[piece]]
name = "queen"
symbol = "Q"
moves = "queen"

[[piece]]
name = "king"
symbol = "K"
royal = true
moves = "king"

[start]
board = "rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR"
