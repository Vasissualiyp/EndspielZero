#
# mustcapture - standard chess in which captures are compulsory.
#
# One rule, evaluated before legality: if the side to move has any capture available,
# every non-capture is forbidden. This is the mechanism a draughts-style game needs,
# demonstrated on a board whose other rules are already verified.
name = "mustcapture"
description = "Every capture is compulsory. Decline one and the move is simply illegal."
difficulty = "easy"
side_to_move = "white"
en_passant = false
stalemate = "draw"
halfmove_draw_limit = 100
orientation_axis = "rank"

[[axis]]
name = "file"
extent = 8

[[axis]]
name = "rank"
extent = 8

[promotion]
rank = 7


[[piece]]
name = "pawn"
symbol = "P"
resets_draw_clock = true
promotes_to = ["knight", "bishop", "rook", "queen"]

  # A single step forward, which may not capture.
  [[piece.move]]
  vector = [1]
  max = 1
  mode = "leap"
  capture = "cannot"
  forward = true

  # Exactly two steps, sliding (so the intermediate cell must be empty), only
  # from the home rank, and leaving an en-passant target behind. "min" is what
  # keeps this from duplicating the single step above.
  [[piece.move]]
  vector = [1]
  min = 2
  max = 2
  mode = "slide"
  capture = "cannot"
  forward = true
  unmoved = true
  marks = [{ tag = "ep", where = "passed", duration = 1 }]

  # The diagonal capture: magnitudes {1,1}, forward, capture-only.
  [[piece.move]]
  vector = [1, 1]
  max = 1
  mode = "leap"
  capture = "must"
  forward = true

  # En passant: capture-only, landing on the cell a double step passed over and taking the
  # pawn that passed it - a capture at an offset, allowed only onto an "ep" mark.
  [[piece.move]]
  vector = [1]
  pin = ["rank:+1"]
  max = 1
  mode = "leap"
  capture = "must"
  flip = true
  captures_at = ["rank:-1"]
  needs_mark = "ep"

[[piece]]
name = "knight"
symbol = "N"

  [[piece.move]]
  vector = [1, 2]
  max = 1
  mode = "leap"

[[piece]]
name = "bishop"
symbol = "B"

  [[piece.move]]
  vector = [1, 1]
  max = "inf"
  mode = "slide"

[[piece]]
name = "rook"
symbol = "R"

  [[piece.move]]
  vector = [1]
  max = "inf"
  mode = "slide"

[[piece]]
name = "queen"
symbol = "Q"
moves = "queen"

[[piece]]
name = "king"
symbol = "K"
royal = true
moves = "king"

# ---------------------------------------------------------------------------
# Castling, as compound moves: the king steps two along the file, the rook is *found* beyond
# it (the first rook along the way, unmoved), and the king's start, the cell it crosses and
# the cell it lands on must not be attacked. No cell is named, so the same two definitions
# castle on any board size, in any dimension.
# ---------------------------------------------------------------------------

[[compound]]
name = "castle kingside"
piece = "king"
vector = [2, 0]
partner = ["rook"]
safe = ["from", "path", "to"]
fen = "K"

[[compound]]
name = "castle queenside"
piece = "king"
vector = [-2, 0]
partner = ["rook"]
safe = ["from", "path", "to"]
fen = "Q"

[start]
board = "rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR"

[[rule]]
name = "captures are compulsory"
when = "on_move_filter"
if = "(and (not is_capture) any_capture)"

  [[rule.effect]]
  op = "forbid_move"
