#
# Standard chess, expressed entirely in EndspielZero's general primitives. Nothing in
# this file is special-cased by the engine: a rook is a repeated unit step, a
# knight is the magnitudes {1,2} on any two distinct axes, castling is a
# displacement template, and "forward" is a declared orientation axis.
#
# The published perft node counts reproducing from this file is the proof that the
# generalized machinery is correct (docs/plan/M1-core-2d.md, section M1.6).

name = "standard"
description = "The game you know, on a plain eight-by-eight board - the reference every other variant here is measured against."
difficulty = "easy"
side_to_move = "white"
en_passant = false
stalemate = "draw"
halfmove_draw_limit = 100
orientation_axis = "rank"

[[axis]]
name = "file"
extent = 8

[[axis]]
name = "rank"
extent = 8

# No [[geometry.identify]] blocks: a plain box with eight walls.

[promotion]
rank = 7            # White's promotion rank; Black's is mirrored automatically

# ---------------------------------------------------------------------------
# Pieces
# ---------------------------------------------------------------------------

[[piece]]
name = "pawn"
symbol = "P"
resets_draw_clock = true
promotes_to = ["knight", "bishop", "rook", "queen"]

  # A single step forward, which may not capture.
  [[piece.move]]
  vector = [1]
  max = 1
  mode = "leap"
  capture = "cannot"
  forward = true

  # Exactly two steps, sliding (so the intermediate cell must be empty), only
  # from the home rank, and leaving an en-passant target behind. "min" is what
  # keeps this from duplicating the single step above.
  [[piece.move]]
  vector = [1]
  min = 2
  max = 2
  mode = "slide"
  capture = "cannot"
  forward = true
  unmoved = true
  marks = [{ tag = "ep", where = "passed", duration = 1 }]

  # The diagonal capture: magnitudes {1,1}, forward, capture-only.
  [[piece.move]]
  vector = [1, 1]
  max = 1
  mode = "leap"
  capture = "must"
  forward = true

  # En passant: capture-only, landing on the cell a double step passed over and taking the
  # pawn that passed it - a capture at an offset, allowed only onto an "ep" mark.
  [[piece.move]]
  vector = [1]
  pin = ["rank:+1"]
  max = 1
  mode = "leap"
  capture = "must"
  flip = true
  captures_at = ["rank:-1"]
  needs_mark = "ep"

[[piece]]
name = "knight"
symbol = "N"

  [[piece.move]]
  vector = [1, 2]
  max = 1
  mode = "leap"

[[piece]]
name = "bishop"
symbol = "B"

  [[piece.move]]
  vector = [1, 1]
  max = "inf"
  mode = "slide"

[[piece]]
name = "rook"
symbol = "R"

  [[piece.move]]
  vector = [1]
  max = "inf"
  mode = "slide"

[[piece]]
name = "queen"
symbol = "Q"
moves = "queen"

[[piece]]
name = "king"
symbol = "K"
royal = true
moves = "king"

# ---------------------------------------------------------------------------
# Castling, as compound moves: the king steps two along the file, the rook is *found* beyond
# it (the first rook along the way, unmoved), and the king's start, the cell it crosses and
# the cell it lands on must not be attacked. No cell is named, so the same two definitions
# castle on any board size, in any dimension.
# ---------------------------------------------------------------------------

[[compound]]
name = "castle kingside"
piece = "king"
vector = [2, 0]
partner = ["rook"]
safe = ["from", "path", "to"]
fen = "K"

[[compound]]
name = "castle queenside"
piece = "king"
vector = [-2, 0]
partner = ["rook"]
safe = ["from", "path", "to"]
fen = "Q"

[start]
board = "rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR"
