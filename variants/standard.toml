#
# Standard chess, expressed entirely in EndspielZero's general primitives. Nothing in
# this file is special-cased by the engine: a rook is a repeated unit step, a
# knight is the magnitudes {1,2} on any two distinct axes, castling is a
# displacement template, and "forward" is a declared orientation axis.
#
# The published perft node counts reproducing from this file is the proof that the
# generalized machinery is correct (docs/plan/M1-core-2d.md, section M1.6).

name = "standard"
description = "The game you know, on a plain eight-by-eight board - the reference every other variant here is measured against."
difficulty = "easy"
side_to_move = "white"
en_passant = true
stalemate = "draw"
halfmove_draw_limit = 100
orientation_axis = "rank"

[[axis]]
name = "file"
extent = 8

[[axis]]
name = "rank"
extent = 8

# No [[geometry.identify]] blocks: a plain box with eight walls.

[promotion]
rank = 7            # White's promotion rank; Black's is mirrored automatically

# ---------------------------------------------------------------------------
# Pieces
# ---------------------------------------------------------------------------

[[piece]]
name = "pawn"
symbol = "P"
resets_draw_clock = true
promotes_to = ["knight", "bishop", "rook", "queen"]

  # A single step forward, which may not capture.
  [[piece.move]]
  vector = [1]
  max = 1
  mode = "leap"
  capture = "cannot"
  forward = true

  # Exactly two steps, sliding (so the intermediate cell must be empty), only
  # from the home rank, and leaving an en-passant target behind. "min" is what
  # keeps this from duplicating the single step above.
  [[piece.move]]
  vector = [1]
  min = 2
  max = 2
  mode = "slide"
  capture = "cannot"
  forward = true
  from_rank = 1
  leaves_en_passant = true

  # The diagonal capture: magnitudes {1,1}, forward, capture-only.
  [[piece.move]]
  vector = [1, 1]
  max = 1
  mode = "leap"
  capture = "must"
  forward = true

[[piece]]
name = "knight"
symbol = "N"

  [[piece.move]]
  vector = [1, 2]
  max = 1
  mode = "leap"

[[piece]]
name = "bishop"
symbol = "B"

  [[piece.move]]
  vector = [1, 1]
  max = "inf"
  mode = "slide"

[[piece]]
name = "rook"
symbol = "R"

  [[piece.move]]
  vector = [1]
  max = "inf"
  mode = "slide"

[[piece]]
name = "queen"
symbol = "Q"
moves = "queen"

[[piece]]
name = "king"
symbol = "K"
royal = true
moves = "king"

# ---------------------------------------------------------------------------
# Castling: cell lists rather than "two squares to the right", so the same
# template shape works in any dimension and on any topology.
# ---------------------------------------------------------------------------

[[castle]]
name = "K"
color = "white"
king_from = "e1"
king_to = "g1"
rook_from = "h1"
rook_to = "f1"
empty = ["f1", "g1"]
safe = ["e1", "f1", "g1"]
rights_bit = 0

[[castle]]
name = "Q"
color = "white"
king_from = "e1"
king_to = "c1"
rook_from = "a1"
rook_to = "d1"
empty = ["b1", "c1", "d1"]
safe = ["e1", "d1", "c1"]
rights_bit = 1

[[castle]]
name = "k"
color = "black"
king_from = "e8"
king_to = "g8"
rook_from = "h8"
rook_to = "f8"
empty = ["f8", "g8"]
safe = ["e8", "f8", "g8"]
rights_bit = 2

[[castle]]
name = "q"
color = "black"
king_from = "e8"
king_to = "c8"
rook_from = "a8"
rook_to = "d8"
empty = ["b8", "c8", "d8"]
safe = ["e8", "d8", "c8"]
rights_bit = 3

[start]
board = "rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR"
