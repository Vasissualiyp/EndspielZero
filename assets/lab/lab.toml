# M24.1: metres, Z up; procedural parts use full extents.
# File meshes (file:models/name.obj) use size as a multiplier; [1,1,1] is as modelled.
version = 1

[anchors]
"gantry.centre" = [0.0, 0.6, 1.05]
"projector.lens" = [-0.6, 2.62, 1.015]
"wallprojector.lens" = [2.225, 2.65, 1.55]
"magazine.front" = [2.245, 1.8, 1.3]
"door.centre" = [0.0, -2.98, 1.2]
"bench.top" = [-0.3, 2.65, 0.925]


# The gantry's deployment volume (M24.5): where slabs can hang, in metres. The
# board's layout centre is placed at "gantry.centre".
[deploy]
min = [-1.45, -0.40, 0.45]
max = [ 1.45,  1.60, 2.05]
rail_z = 2.46            # carriage underside: masts start here
mast_edge_gap = 0.06     # metres between the slab's far bezel edge and the mast axis
yoke_drop = 0.035        # the yoke's centre below the slab's back face
slab_bay = "magazine.slab"   # prefix of the parked stand-ins, 0..7

